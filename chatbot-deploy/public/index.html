<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Chat Assistant</title>
<style>
:root{--bg:#faf9f6;--surface:#fff;--text:#1f1e1c;--muted:#76726b;--border:#e5e2db;--accent:#c96442;--accent-text:#fff;--user:#f0ede6;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1c1b19;--surface:#262522;--text:#efece6;--muted:#9b968d;--border:#3a3834;--accent:#d97757;--accent-text:#1c1b19;--user:#33312d;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#1c1b19;--surface:#262522;--text:#efece6;--muted:#9b968d;--border:#3a3834;--accent:#d97757;--accent-text:#1c1b19;--user:#33312d;color-scheme:dark}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--text);font:16px/1.55 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
.app{display:flex;flex-direction:column;height:100%;max-width:760px;margin:0 auto}
header{display:flex;align-items:center;justify-content:space-between;padding:14px 18px;border-bottom:1px solid var(--border)}
header h1{font-size:17px;margin:0;font-weight:600}
header button{background:none;border:1px solid var(--border);color:var(--muted);border-radius:8px;padding:6px 12px;font:inherit;font-size:14px;cursor:pointer}
header button:hover{color:var(--text)}
#log{flex:1;overflow-y:auto;padding:18px;display:flex;flex-direction:column;gap:14px}
.msg{max-width:88%;padding:10px 14px;border-radius:14px;white-space:pre-wrap;word-wrap:break-word;overflow-wrap:anywhere}
.msg.user{align-self:flex-end;background:var(--user)}
.msg.bot{align-self:flex-start;background:var(--surface);border:1px solid var(--border)}
.msg.err{color:#b3261e;border-color:#b3261e}
.msg pre{background:var(--bg);border:1px solid var(--border);border-radius:8px;padding:10px;overflow-x:auto;margin:8px 0;white-space:pre}
.msg code{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:.92em}
.empty{margin:auto;text-align:center;color:var(--muted);padding:20px}
.empty h2{color:var(--text);font-size:22px;margin:0 0 6px}
.chips{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin-top:14px}
.chips button{background:var(--surface);border:1px solid var(--border);color:var(--text);border-radius:999px;padding:7px 14px;font:inherit;font-size:14px;cursor:pointer}
.chips button:hover{border-color:var(--accent)}
form{display:flex;gap:8px;padding:12px 18px 16px;border-top:1px solid var(--border)}
textarea{flex:1;resize:none;max-height:140px;background:var(--surface);color:var(--text);border:1px solid var(--border);border-radius:12px;padding:10px 14px;font:inherit;outline:none}
textarea:focus{border-color:var(--accent)}
#send{background:var(--accent);color:var(--accent-text);border:0;border-radius:12px;padding:0 18px;font:inherit;font-weight:600;cursor:pointer}
#send:disabled{opacity:.5;cursor:default}
</style>
</head>
<body>
<div class="app">
  <header><h1>Chat Assistant</h1><button id="clear" type="button">New chat</button></header>
  <div id="log"></div>
  <div class="composer-wrap">
    <div id="composer" style="display:contents">
      <form id="f">
        <textarea id="in" rows="1" placeholder="Ask me anything…" autocomplete="off"></textarea>
        <button id="send" type="submit">Send</button>
      </form>
    </div>
  </div>
</div>
<script>
(function(){
  var log = document.getElementById("log"), input = document.getElementById("in"),
      sendBtn = document.getElementById("send"), form = document.getElementById("f");
  var history = [], busy = false;

  var SUGGESTIONS = ["Explain how APIs work", "Help me brainstorm startup ideas", "Debug a CSS layout issue", "Summarize a topic simply"];

  function el(tag, cls, text){ var e = document.createElement(tag); if(cls) e.className = cls; if(text != null) e.textContent = text; return e; }

  function renderRich(node, text){
    node.textContent = "";
    var parts = text.split("```");
    parts.forEach(function(p, i){
      if(i % 2 === 1){
        var nl = p.indexOf("\n");
        var code = nl > -1 && nl < 20 ? p.slice(nl + 1) : p;
        var pre = el("pre"); pre.appendChild(el("code", null, code.replace(/\n$/, ""))); node.appendChild(pre);
      } else if(p){ node.appendChild(document.createTextNode(p)); }
    });
  }

  function showEmpty(){
    log.textContent = "";
    var box = el("div", "empty");
    box.appendChild(el("h2", null, "How can I help today?"));
    box.appendChild(el("div", null, "Ask a question, get an explanation, or think something through."));
    var chips = el("div", "chips");
    SUGGESTIONS.forEach(function(s){
      var b = el("button", null, s); b.type = "button";
      b.onclick = function(){ send(s); };
      chips.appendChild(b);
    });
    box.appendChild(chips); log.appendChild(box);
  }

  function addMsg(role, text, extra){
    var empty = log.querySelector(".empty"); if(empty) log.removeChild(empty);
    var m = el("div", "msg " + role + (extra ? " " + extra : ""));
    if(role === "bot") renderRich(m, text); else m.textContent = text;
    log.appendChild(m); log.scrollTop = log.scrollHeight; return m;
  }

  function setBusy(b){ busy = b; sendBtn.disabled = b; }

  async function send(text){
    text = (text || "").trim();
    if(!text || busy) return;
    input.value = ""; input.style.height = "auto";
    addMsg("user", text);
    history.push({role: "user", content: text});
    var botEl = addMsg("bot", "Thinking…");
    setBusy(true);
    try {
      var r = await fetch("/api/chat", {
        method: "POST",
        headers: {"Content-Type": "application/json"},
        body: JSON.stringify({messages: history})
      });
      var data = await r.json().catch(function(){ return {}; });
      if(!r.ok) throw new Error(data.error || "Request failed (" + r.status + ")");
      renderRich(botEl, data.text);
      history.push({role: "assistant", content: data.text});
    } catch(e){
      history.pop();
      botEl.className = "msg bot err";
      botEl.textContent = "Something went wrong: " + e.message;
    }
    setBusy(false); input.focus(); log.scrollTop = log.scrollHeight;
  }

  form.addEventListener("submit", function(e){ e.preventDefault(); send(input.value); });
  input.addEventListener("keydown", function(e){
    if(e.key === "Enter" && !e.shiftKey){ e.preventDefault(); send(input.value); }
  });
  input.addEventListener("input", function(){ input.style.height = "auto"; input.style.height = Math.min(input.scrollHeight, 140) + "px"; });
  document.getElementById("clear").onclick = function(){ if(busy) return; history = []; showEmpty(); };

  showEmpty();
})();
</script>
</body>
</html>
